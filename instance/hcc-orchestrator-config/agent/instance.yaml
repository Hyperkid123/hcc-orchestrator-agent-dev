workflow: jira-kanban
source: jira
# OpenCode V2/OpenAI profile. Removing these selectors restores Python/Claude
# runtime defaults; native subagents and MCP settings apply only to OpenCode.
runtime: opencode
provider: rehor-openai
model: gpt-6.1-sol
image:
  repository: quay.io/redhat-services-prod/hcc-platex-services/hcc-orchestrator-agent-dev
  tag: latest
env:
  BOT_INSTANCE_ID: 'Řehoř Slídil'
  BOT_LABEL: hcc-ai-orchestrator
  BOT_BOARD_NAME: '14371'
  BOT_JIRA_PROJECT: RHCLOUD
  BOT_CONFIG_PATH: instance/hcc-orchestrator-config
  BOT_EXECUTION_ENGINE: coordinator
preflights:
  - gh-pr-status
  - gl-mr-status
  - id: jira-kanban
    with:
      project: RHCLOUD
      label: hcc-ai-orchestrator
      statuses:
        - New
        - Backlog
        - To Do
# Legacy KEDA window of devbot-hcc-orchestrator (deploy/template.yaml defaults):
# the dispatcher starts no sessions outside it; in-flight sessions drain.
schedule:
  triggers:
    - timezone: Europe/Prague
      start: "0 9 * * 1-5"
      end: "0 23 * * 1-5"
envs:
  - node
  - go
  - browser
  - patternfly-mcp
